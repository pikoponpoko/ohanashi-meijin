<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おはなし名人</title><meta name="theme-color" content="#eeefec"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Zen+Old+Mincho&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<main>
<header><div class="crumb"><button id="project" class="projectHeader" title="作品情報・表紙"><span class="brand">おはなし名人</span><strong id="projectTitle"></strong></button><button id="menu" class="chapterPicker" aria-haspopup="true" aria-expanded="false" aria-controls="chapterPanel" title="章を選ぶ"><span id="currentChapterMark" aria-hidden="true">○</span><span id="currentChapterName"></span><span aria-hidden="true">⌄</span></button><span id="breadcrumb" hidden></span><span class="saved" id="saved">保存済み</span></div><div class="actions"><button id="direction" title="縦書き・横書き">縦書き</button><button id="settings" title="文字表示設定">Aa</button><button id="focus" title="集中モード Ctrl+Shift+F" aria-pressed="false">⛶</button></div></header>
<section class="toolbar"><div class="tabs"><button data-insert="scene" title="選択段落を柱に Alt+1">柱 <kbd>1</kbd></button><button data-insert="action" title="選択段落をト書きに Alt+2">ト書き <kbd>2</kbd></button><button data-insert="dialogue" title="選択段落をセリフに Alt+3">セリフ <kbd>3</kbd></button></div><div class="formatActions"><button id="autoFormat">自動整形</button><button id="check">自動修正 <span id="issueCount"></span></button></div></section>
<div id="writing"><div id="editor" contenteditable="true" spellcheck="false" role="textbox" aria-label="脚本本文" aria-multiline="true"></div><div id="emptyHint"></div></div>
<footer><div class="footerStatus"><div id="overallProgress" aria-label="全体の執筆進捗"><div id="chart"><span id="percent"></span></div><span id="progressText"></span><div id="legend"></div></div><span id="count"></span><button id="duration" title="推定尺の計算根拠"></button></div><div class="footerActions"><button id="newDocument" class="plain">＋ 新規</button><button id="savedDocuments" class="plain" hidden>保存した原稿</button><button id="backup" class="plain">↓ バックアップ</button><button id="import" class="plain">↑ 開く</button><button id="export" class="export">書き出し ↗</button><button id="theme" title="明暗を切り替え">◐</button><button id="installApp" class="plain" hidden>インストール</button></div><input id="file" type="file" hidden></footer>
</main>
<button id="sidebarBackdrop" aria-label="章一覧を閉じる"></button>
<div id="chapterPanel" hidden role="region" aria-label="章一覧"><div class="chapterPanelHead"><span id="chapterNumber"></span><button id="closeChapters" aria-label="章一覧を閉じる">×</button></div><input id="chapterTitle" aria-label="章のタイトル"><nav id="chapters" aria-label="章を選ぶ"></nav><div class="chapterPanelActions"><button id="add" title="章を追加">＋ 章を追加</button><select id="status" aria-label="章の進捗"><option>未着手</option><option>見直し</option><option>完了</option></select><button id="splitChapter">選択範囲を章に</button><button id="deleteChapter">章を削除</button></div></div>
<div id="focusControls" hidden aria-label="集中モードの操作"><span id="focusChapter" role="status"></span><button id="browserFullscreen" title="ブラウザの全画面表示">全画面</button><button id="exitFocus">集中モードを終了</button></div>
<nav id="focusFooter" hidden aria-label="集中モードの章移動"><button id="previousChapter" title="前の章 Alt+PageUp" aria-keyshortcuts="Alt+PageUp">← 前の章</button><button id="nextChapter" title="次の章 Alt+PageDown" aria-keyshortcuts="Alt+PageDown">次の章 →</button></nav>
<button id="focusGesture" hidden aria-label="集中モード操作。二本指を広げて開始、狭めて終了">集中モード操作</button>
<dialog id="dialog"><div class="dialoghead"><h2 id="dialogTitle"></h2><button id="close" aria-label="閉じる">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div><div id="printRoot"></div>
<script src="vendor/jspdf.umd.min.js"></script><script src="vendor/html-to-image.js"></script><script src="model.js"></script><script src="app.js"></script><script src="pdf.js"></script><script src="editing.js"></script><script src="formatting-model.js"></script><script src="formatting.js"></script><script src="projects.js"></script><script src="pwa.js"></script><script src="focus.js"></script><script src="viewport.js"></script><script src="layout.js"></script><script src="timing-model.js"></script><script src="timing.js"></script></body></html>
