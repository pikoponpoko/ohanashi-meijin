<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おはなし名人</title><meta name="theme-color" content="#eeefec"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Zen+Old+Mincho&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<aside id="sidebar"><div class="brand">おはなし名人</div><button id="project" class="project"><small>PROJECT</small><strong id="projectTitle"></strong><span>作品情報・表紙　↗</span></button><div class="sectionlabel">CHAPTERS <button id="add" title="章を追加">＋</button></div><nav id="chapters"></nav><div class="sidebarbottom"><div class="progresshead">執筆の進捗 <span id="progressText"></span></div><div class="progresswrap"><div id="chart"><span id="percent"></span></div><div id="legend"></div></div><button id="newDocument" class="plain">＋ 新しい作品</button><button id="savedDocuments" class="plain" hidden>保存した原稿</button><button id="installApp" class="plain" hidden>アプリをインストール</button><button id="backup" class="plain">↓ バックアップ</button><button id="import" class="plain">↑ 原稿・バックアップを開く</button><input id="file" type="file" hidden><div class="localnote">原稿はこのブラウザに自動保存</div></div></aside>
<button id="sidebarBackdrop" aria-label="章一覧を閉じる"></button><main><header><div class="crumb"><button id="menu" title="章一覧">☰</button><span id="breadcrumb"></span><span class="saved" id="saved">保存済み</span></div><div class="actions"><button id="direction" title="縦書き・横書き">縦書き</button><button id="settings">Aa</button><button id="theme" title="明暗を切り替え">◐</button><button id="focus" title="集中モード Ctrl+Shift+F" aria-pressed="false">⛶</button><button id="export" class="export">書き出し ↗</button></div></header>
<section class="chapterbar"><div><span class="eyebrow" id="chapterNumber"></span><input id="chapterTitle" aria-label="章のタイトル"></div><button id="splitChapter">選択範囲を章に</button><button id="deleteChapter">章を削除</button><select id="status" aria-label="章の進捗"><option>未着手</option><option>見直し</option><option>完了</option></select></section>
<section class="toolbar"><div class="tabs"><button data-insert="scene">柱 <kbd>1</kbd></button><button data-insert="action">ト書き <kbd>2</kbd></button><button data-insert="dialogue">セリフ <kbd>3</kbd></button></div><div><button id="undo" title="元に戻す（二本指タップ）">↶ 元に戻す</button><button id="redo" title="やり直し（三本指タップ）">↷ やり直し</button></div><button id="check">自動修正 <span id="issueCount"></span></button></section>
<div id="writing"><div id="editor" contenteditable="true" spellcheck="false" role="textbox" aria-label="脚本本文" aria-multiline="true"></div><div id="emptyHint"></div></div><footer><span id="count"></span><span id="duration"></span><span class="footerhint">Ctrl + Shift + F で集中モード</span></footer></main>
<div id="focusControls" hidden aria-label="集中モードの操作"><button id="previousChapter" title="前の章 Alt+PageUp" aria-keyshortcuts="Alt+PageUp" aria-label="前の章">←</button><span id="focusChapter" role="status"></span><button id="nextChapter" title="次の章 Alt+PageDown" aria-keyshortcuts="Alt+PageDown" aria-label="次の章">→</button><button id="browserFullscreen" title="ブラウザの全画面表示">全画面</button><button id="exitFocus">集中モードを終了</button></div><button id="focusGesture" hidden aria-label="集中モード操作。二本指を広げて開始、狭めて終了">集中モード操作</button><dialog id="dialog"><div class="dialoghead"><h2 id="dialogTitle"></h2><button id="close" aria-label="閉じる">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div><div id="printRoot"></div><script src="vendor/jspdf.umd.min.js"></script><script src="vendor/html-to-image.js"></script><script src="model.js"></script><script src="app.js"></script><script src="pdf.js"></script><script src="editing.js"></script><script src="projects.js"></script><script src="pwa.js"></script><script src="focus.js"></script><script src="viewport.js"></script></body></html>
