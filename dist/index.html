<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Togaki</title><meta name="theme-color" content="#eeefec"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/official-32.png"><link rel="apple-touch-icon" href="icons/official-180.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Zen+Old+Mincho&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<main>
<header><div class="crumb"><button id="project" class="projectHeader" title="作品情報・表紙" aria-label="作品情報"><strong id="projectTitle"></strong></button><button id="menu" class="chapterPicker" aria-haspopup="true" aria-expanded="false" aria-controls="chapterPanel" title="章を選ぶ"><span id="currentChapterMark" aria-hidden="true">○</span><span id="currentChapterName"></span><svg class="chapterChevron" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="breadcrumb" hidden></span><span class="saved" id="saved">保存済み</span></div><div class="actions"><button id="direction" title="縦書き・横書き Ctrl+Shift+D" aria-keyshortcuts="Control+Shift+D">縦書き</button><button id="find" title="検索と置換 Ctrl+F" aria-label="検索と置換" aria-keyshortcuts="Control+F Control+H"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><button id="rules" title="脚本の表記ルール" aria-label="脚本の表記ルール" aria-expanded="false">?</button><button id="settings" title="設定" aria-label="設定"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button id="focus" title="集中モード Ctrl+Shift+F" aria-label="集中モード" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div></header>
<section class="toolbar"><div class="tabs"><button data-insert="scene" title="選択段落を柱に Alt+1">柱 <kbd>1</kbd></button><button data-insert="action" title="選択段落をト書きに Alt+2">ト書き <kbd>2</kbd></button><button data-insert="dialogue" title="選択段落をセリフに Alt+3">セリフ <kbd>3</kbd></button><button data-insert="music" title="選択段落を音楽に Alt+4">音楽 <kbd>4</kbd></button><button data-insert="se" title="選択段落をSEに Alt+5">SE <kbd>5</kbd></button><button id="speaker" title="セリフの話者名を入力">話者</button></div><div class="formatActions"><button data-fix="blank" title="連続した空行・カット直後の空行を削除">空行を整理</button><button data-fix="indent" title="ト書きの頭を３字下げ">字下げ</button><button data-fix="quote" title="セリフの閉じカギ括弧を補う">閉じカギ</button><button data-fix="ellipsis" title="三点リーダーを２つにそろえる">……</button><button id="autoFormat" title="全段落の書式を判定して確認・適用">自動整形</button></div></section>
<div id="writing"><div id="editor" contenteditable="true" spellcheck="false" role="textbox" aria-label="脚本本文" aria-multiline="true"></div><div id="emptyHint"></div></div>
<footer><div class="footerStatus"><div id="overallProgress" aria-label="全体の執筆進捗"><div id="chart"><span id="percent"></span></div><span id="progressText"></span><div id="legend"></div></div><span id="count"></span><button id="duration" title="推定尺の計算根拠"></button></div><div class="footerActions"><button id="newDocument" class="plain">＋ 新規</button><button id="savedDocuments" class="plain" hidden>保存した原稿</button><button id="backup" class="plain" title="保存 Ctrl+S" aria-keyshortcuts="Control+S">保存</button><button id="saveAs" class="plain" title="名前を付けて保存 Ctrl+Shift+S" aria-keyshortcuts="Control+Shift+S">別名保存</button><span id="fileStatus" role="status"></span><button id="import" class="plain" title="開く Ctrl+O" aria-keyshortcuts="Control+O">開く</button><button id="cloud" class="plain" title="クラウド同期">クラウド</button><button id="export" class="export" title="書き出し Ctrl+E（印刷 Ctrl+P）" aria-keyshortcuts="Control+E Control+P">書き出し ↗</button><button id="theme" title="明暗を切り替え">◐</button><button id="installApp" class="plain" hidden>インストール</button></div><input id="file" type="file" hidden></footer>
</main>
<button id="sidebarBackdrop" aria-label="章一覧を閉じる"></button>
<div id="chapterPanel" hidden role="region" aria-label="章一覧"><div class="chapterPanelHead"><span id="chapterNumber"></span><button id="closeChapters" aria-label="章一覧を閉じる">×</button></div><input id="chapterTitle" aria-label="章のタイトル"><nav id="chapters" aria-label="章を選ぶ"></nav><div class="chapterPanelActions"><button id="add" title="章を追加">＋ 章を追加</button><select id="status" aria-label="章の進捗"><option>未着手</option><option>見直し</option><option>完了</option></select><button id="splitChapter">選択範囲を章に</button><button id="deleteChapter">章を削除</button></div></div>
<div id="focusControls" hidden aria-label="集中モードの操作"><button id="exitFocus" title="集中モードを終了" aria-label="集中モードを終了">×</button></div>
<nav id="focusFooter" hidden aria-label="集中モードの章移動"><button id="previousChapter" title="前の章 Alt+PageUp" aria-keyshortcuts="Alt+PageUp">前の章 →</button><span id="focusChapter" role="status"></span><button id="nextChapter" title="次の章 Alt+PageDown" aria-keyshortcuts="Alt+PageDown">← 次の章</button></nav>
<button id="focusGesture" hidden aria-label="集中モード操作。二本指を広げて開始、狭めて終了">集中モード操作</button>
<dialog id="dialog"><div class="dialoghead"><h2 id="dialogTitle"></h2><button id="close" aria-label="閉じる">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div><div id="printRoot"></div><div id="previewBar" role="toolbar" aria-label="印刷プレビュー"><span id="previewCount" role="status"></span><div class="previewColumns"><button data-columns="1">1段</button><button data-columns="2">2段</button></div><select id="previewSize" aria-label="印刷の文字サイズ"></select><label><input id="previewCover" type="checkbox"> 表紙</label><span class="previewSpacer"></span><button id="previewPdf">PDFに保存</button><button id="previewPrint" class="primary" title="印刷 Ctrl+P">印刷</button><button id="previewClose" aria-label="閉じる">×</button></div>
<script src="vendor/jspdf.umd.min.js"></script><script src="vendor/html-to-image.js"></script><script src="model.js"></script><script src="formatting-model.js"></script><script src="persistence.js"></script><script src="themes.js"></script><script src="appearance.js"></script><script src="app.js"></script><script src="pdf.js"></script><script src="print-preview.js"></script><script src="editing.js"></script><script src="formatting.js"></script><script src="projects.js"></script><script src="prepro-return.js"></script><script src="files.js"></script><script src="connection.js"></script><script src="pwa.js"></script><script src="focus.js"></script><script src="viewport.js"></script><script src="layout.js"></script><script src="timing-model.js"></script><script src="timing.js"></script><script src="find.js"></script><script src="rules.js"></script><script src="shortcuts.js"></script><script src="cloud-model.js"></script><script src="cloud.js"></script></body></html>
