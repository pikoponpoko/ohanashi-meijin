<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Togaki｜接続の修復</title>
<style>:root{color-scheme:light;--bg:#eeece6;--paper:#f5f3ed;--ink:#30302f;--line:#d8d6d0}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 system-ui,sans-serif}body.dark{color-scheme:dark;--bg:#262626;--paper:#2c2c2c;--ink:#dededb;--line:#404040}main{max-width:38rem;margin:8vh auto;padding:24px;background:var(--paper)}h1{font-size:1.3rem}button{display:block;margin:16px 0;padding:12px 16px;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid currentColor;outline-offset:3px}a{color:inherit}@media(max-width:600px){main{margin:16px}}</style></head>
<body><main><h1>接続の修復</h1><p id="status" role="status">保存データを確認しています。</p><button id="saveRecovery" disabled>原稿を保存</button><button id="repairConnection" disabled>保存を確認して接続を修復</button><p>他の画面に入力中の原稿がある場合は、保存してから閉じてください。原稿は削除せず、このアプリのService Workerだけを解除して開き直します。</p><a href="./">アプリへ戻る</a></main><script src="persistence.js"></script><script src="connection.js"></script><script src="recovery.js"></script></body></html>
